name: digest

on:
  # 定刻の起動は worker/ の Cron Trigger が workflow_dispatch で行う。schedule は数時間遅れるので、
  # Worker が動かなかった日の保険として残す（Worker の実行後なら Load state で止まる）
  schedule:
    - cron: '27 13 * * *' # UTC 13:27 ＝ JST 22:27
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print messages to the log instead of sending; do not save state'
        type: boolean
        default: false
      sources:
        description: 'Send only these sources from digest.toml (comma separated)'
        required: false

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 送信済み URL は state ブランチの seen.txt に置く。actions/cache は7日触らないと消えるため使わない
      - name: Load state
        id: state
        run: |
          mkdir -p state
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:seen.txt > state/seen.txt
            age=$(( $(date +%s) - $(git log -1 --format=%ct FETCH_HEAD) ))
            # 20時間以内に state が更新されていれば、その日の配信は済んでいる
            if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$age" -lt 72000 ]; then
              echo "state was updated $((age / 3600))h ago; skipping the delayed schedule run"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run digest
        if: steps.state.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 配信元・件数・選別は digest.toml。ここで渡すのはその回だけの絞り込み
          DIGEST_SOURCES: ${{ inputs.sources || vars.DIGEST_SOURCES }}
        run: python -m tg_dev_digest ${{ inputs.dry_run && '--dry-run' || '' }}

      # 配信元の一部が落ちた日も、届いた分は seen に残す
      - name: Save state
        if: ${{ !cancelled() && steps.state.outputs.skip != 'true' && !inputs.dry_run && hashFiles('state/seen.txt') != '' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w state/seen.txt)
          tree=$(printf '100644 blob %s\tseen.txt\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "state: $(date -u +%F)")
          git push --force origin "${commit}:refs/heads/state"
